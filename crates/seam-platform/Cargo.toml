[package]
name         = "seam-platform"
description  = "OS-specific implementations of the seam-core platform traits."
version      = "0.1.0"
edition.workspace      = true
rust-version.workspace = true

[dependencies]
seam-core = { path = "../seam-core" }
tracing   = { workspace = true }
tokio     = { workspace = true }

# Windows — see Tier 5.4 of the build guide. Kept minimal for M1 (capture,
# inject, screens); clipboard/HiDPI extras land with later milestones.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",    # SetWindowsHookEx, message pump
    "Win32_UI_Input_KeyboardAndMouse", # SendInput, VK codes
    "Win32_Graphics_Gdi",              # EnumDisplayMonitors
    "Win32_UI_HiDpi",                  # per-monitor DPI awareness
    "Win32_System_Threading",          # GetCurrentThreadId, for stop()'s WM_QUIT
] }

[dev-dependencies]
tracing-subscriber = { workspace = true }

# macOS — see Tier 5.4 of the build guide. No objc2 crates needed for M5:
# CGEventTap/CGEventPost/display enumeration/the Accessibility check all
# go through direct `extern "C"` FFI against
# CoreGraphics/CoreFoundation/ApplicationServices (`cg_ffi.rs`) rather
# than objc2-core-graphics — those C ABIs have been stable for decades
# and are more reliably gotten right from memory than a newer wrapper
# crate's exact Rust-side shape. Using CGDisplayBounds/CGDisplayPixelsWide
# instead of NSScreen also sidesteps a real gotcha: NSScreen's coordinate
# space has its origin at the bottom-left with Y increasing upward, while
# CGEventTap/CGWarpMouseCursorPosition use a top-left origin with Y
# increasing downward — mixing the two silently flips Y. objc2/objc2-app-kit
# will likely return for M7 (NSPasteboard clipboard access).
