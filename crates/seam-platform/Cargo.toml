[package]
name         = "seam-platform"
description  = "OS-specific implementations of the seam-core platform traits."
version      = "0.1.0"
edition.workspace      = true
rust-version.workspace = true

[dependencies]
seam-core = { path = "../seam-core" }
tracing   = { workspace = true }
tokio     = { workspace = true }

# Windows clipboard.rs: AddClipboardFormatListener on a message-only
# window, GlobalAlloc'd CF_UNICODETEXT/PNG clipboard formats.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging", # message pump, message-only window
    "Win32_Graphics_Gdi",           # RegisterClassExW/WNDCLASSEXW are gated behind this
    "Win32_System_Threading",       # GetCurrentThreadId, for stop()'s WM_QUIT
    "Win32_System_DataExchange",    # OpenClipboard/SetClipboardData/AddClipboardFormatListener
    "Win32_System_Memory",          # GlobalAlloc/GlobalLock for clipboard payloads
    "Win32_System_Ole",             # CF_UNICODETEXT and friends
    "Win32_System_LibraryLoader",   # GetModuleHandleW, for registering the message-only window class
] }

# macOS clipboard.rs: NSPasteboard is a heavily Objective-C-object-oriented
# API (not a stable flat C ABI), so it goes through the `objc2`/
# `objc2-app-kit` safe wrappers rather than hand-written FFI. Feature lists
# trimmed to just NSPasteboard's own dependency chain (reading the class
# definition's own `[features]` block in objc2-app-kit shows exactly what
# it needs) rather than each crate's large default feature set.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSPasteboard",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSString",
    "NSData",
] }

[dev-dependencies]
tracing-subscriber = { workspace = true }
